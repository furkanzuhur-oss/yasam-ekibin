# Render.com ucretsiz dagitim plani (Blueprint).
# render.com -> New -> Blueprint -> bu repoyu sec.
services:
  - type: web
    name: yasam-ekibin
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
